[project]
name = "sophon-bench"
version = "0.1.0"
description = "Black-box latency benchmark harness for the sophon speech daemon"
requires-python = ">=3.10"
dependencies = [
    "dbus-next>=0.2.3",
]

[project.scripts]
sophon-bench = "sophon_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sophon_bench"]
